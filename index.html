<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/main.css">

    <title>Consensus AI Lab</title>
</head>

<body>

    <header>
        <h1>Consensus AI Lab</h1>
    </header>

<div class="container">

    <h3>Užduotis</h3>

    <textarea
        id="task"
        rows="4">
    </textarea>

    <h3>Tekstas</h3>

    <textarea
        id="text"
        rows="10">
    </textarea>

    <br><br>

    <button onclick="generatePrompt()">
        Generuoti užklausą
    </button>

    <button onclick="saveProject()">
        Išsaugoti projektą
    </button>

    <br><br>

    <textarea
        id="promptOutput"
        rows="12">
    </textarea>

    <!-- ČIA ĮTERPIAMAS 3.3 BLOKAS -->

    <h2>Vertintojai</h2>

    <label>Claude</label>
    <input
        id="claudeScore"
        type="number"
        step="0.1">

    <label>Gemini</label>
    <input
        id="geminiScore"
        type="number"
        step="0.1">

    <label>ChatGPT</label>
    <input
        id="chatgptScore"
        type="number"
        step="0.1">

    <label>Copilot</label>
    <input
        id="copilotScore"
        type="number"
        step="0.1">

    <br><br>

    <button onclick="calculateConsensus()">
        Skaičiuoti
    </button>

    <!-- 3.4 BLOKAS -->

    <h2>Rezultatai</h2>

    <p>
        Average Score:
        <span id="averageScore">0</span>
    </p>

    <p>
        Consensus:
        <span id="consensusScore">0%</span>
    </p>

    <!-- 3.8 BLOKAS -->

    <h2>Arbitras</h2>

    <textarea
        id="arbitratorNotes"
        rows="10"
        placeholder="Įklijuokite Copilot arbitro išvadą">
    </textarea>

</div>

   <script src="js/consensus.js"></script>
   <script src="js/app.js"></script>
   <script src="js/storage.js"></script>

</body>

</html>
