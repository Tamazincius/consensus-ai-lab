<body>

    <header>
        <h1>Consensus AI Lab</h1>
    </header>

<div class="container">

    <h2>Projektai</h2>

<button onclick="createProject()">
Naujas projektas
</button>

<br><br>

<select id="projectList">
</select>

<hr>

    <h2>Dashboard</h2>

<p>
Kokybė:
<span id="dashboardQuality">
0
</span>
</p>

<p>
Konsensusas:
<span id="dashboardConsensus">
0%
</span>
</p>

<p>
Statusas:
<span id="dashboardStatus">
DRAFT
</span>
</p>

<hr>

    <h2>Kokybės progresas</h2>

<canvas
id="qualityChart"
height="120">
</canvas>

<hr>

<textarea
id="task"
rows="4">
</textarea>

<h2>Tekstas</h2>

<textarea
id="text"
rows="10">
</textarea>

<hr>

    <h2>Veiksmai</h2>

<button onclick="generatePrompt()">
Generuoti užklausą
</button>

<button onclick="saveProject()">

</button>

<button onclick="runConsensusCycle()">
RUN CONSENSUS CYCLE
</button>

<hr>

    <h2>Promptas modeliams</h2>

<textarea
id="promptOutput"
rows="12">
</textarea>
